# Minimal SearXNG config for Sanae; everything else uses SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "Sanae search"

server:
  # secret_key comes from the SEARXNG_SECRET environment variable (searxng/.env)
  limiter: false          # single local user; no bot protection needed
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json                # Sanae reads results as JSON

# Private web search for Sanae. Start with: docker compose up -d
services:
  searxng:
    image: searxng/searxng:latest
    container_name: sanae-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"      # localhost only
    volumes:
      - ./searxng:/etc/searxng:rw
    env_file:
      - searxng/.env               # SEARXNG_SECRET, generated by setup.ps1 (not in git)
